[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snfusion"
version = "0.1.0"
description = "Reference implementations for 'Towards a Unified View of Sensor Fusion: Theory, Methods, and Autonomous Driving Applications' (Springer Nature, 2026)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Kyriakos M. Deliparaschos" },
  { name = "Gabriele Oliva" },
  { name = "Themistoklis Charalambous" },
]
keywords = ["sensor fusion", "Kalman filter", "zonotope", "evidence theory", "AHP", "autonomous driving"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
examples = ["matplotlib>=3.7", "pandas>=2.0"]
dev = ["pytest>=7.0", "matplotlib>=3.7", "pandas>=2.0"]

[tool.setuptools]
packages = ["snfusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
